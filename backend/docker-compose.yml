services:

  postgres:
    image: postgres:15
    container_name: school_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: school
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d school"]
      interval: 5s
      retries: 5

  mcp_server:
    build: .
    command: uv run mcp/server.py
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build: .
    volumes:
      - .:/app                          # mount code
      - /app/.venv                      # but keep container's .venv intact
    command: uv run chat/chat.py
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_started

volumes:
  postgres_data: